[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amv-stt"
version = "2.1.0"
description = "On-device Speech-to-Text & Neural Diarization framework for Android Termux (Whisper.cpp Vulkan GPU & Sherpa-ONNX)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
keywords = [
  "termux",
  "stt",
  "speech-to-text",
  "whisper",
  "whisper-cpp",
  "sherpa-onnx",
  "diarization",
  "speaker-diarization",
  "voice-recognition",
  "audio-transcription",
  "on-device-ai",
  "edge-ai",
  "mobile-ai",
  "vulkan",
  "vulkan-compute",
  "gpu-acceleration",
  "real-time-factor",
  "low-latency",
  "arm64",
  "android",
  "snapdragon",
  "adreno",
  "exynos",
  "arm-mali",
  "zero-compilation",
  "vad",
  "voice-activity-detection",
  "silero-vad",
  "x-vector",
  "k-means",
  "clustering",
  "srt-export",
  "vtt-export",
  "rttm",
  "microphone-streaming",
  "headless-audio",
  "pulseaudio",
  "offline-speech",
  "privacy-first",
  "amv-aichain",
  "amv-tts",
  "amv-llamacpp",
  "amv-diffusion",
  "ameva-runtime",
  "ggml",
  "quantization",
  "bionic-libc",
  "autonomous-agents",
  "voice-assistant"
]
authors = [
  {name = "Eunho Kim (@uno-km)"}
]
dependencies = ["cffi>=1.15.0", "srt>=3.5.0"]

# GPU acceleration (ameva-runtime / AMUDA) is optional and not a PyPI dependency:
# PyPI rejects direct URL references in package metadata, and these SDKs are not
# yet republished on PyPI (see https://github.com/uno-km/ameva-device-sdk). The code
# already lazy-imports ameva_device/ameva_component and fails loud with
# AMU_ERR_RUNTIME_REQUIRED (exit 69) if GPU execution is requested without them.
# To enable GPU: pip install https://github.com/uno-km/ameva-device-sdk/releases/download/v0.2.0/ameva_device_sdk-0.2.0-py3-none-any.whl

[project.optional-dependencies]
gpu = ["ameva-runtime>=2.0.0"]
# component = ["ameva-component-sdk>=0.1.0,<2.0"]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
amv-stt = "termux_stt.cli.main:main"
amv-stt-install = "termux_stt.platform.installer:main"

[project.entry-points."ameva.components"]
amv-stt = "termux_stt.adapter:create_adapter"


[project.urls]
Homepage = "https://uno-km.vercel.app/lib/stt/"
Documentation = "https://uno-km.vercel.app/lib/stt/"
Repository = "https://github.com/uno-km/amv-stt"
Issues = "https://github.com/uno-km/amv-stt/issues"

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E722"]

[tool.ruff.lint.isort]
known-first-party = ["termux_stt"]

[tool.setuptools.packages.find]
where = ["."]
include = ["termux_stt*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]



