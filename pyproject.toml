[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "termux-stt"
version = "2.0.5"
description = "On-device Speech-to-Text & Neural Diarization framework for Android Termux (Whisper.cpp Vulkan GPU & Sherpa-ONNX)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
keywords = [
  "termux",
  "stt",
  "speech-to-text",
  "whisper",
  "whisper-cpp",
  "sherpa-onnx",
  "diarization",
  "speaker-diarization",
  "voice-recognition",
  "audio-transcription",
  "on-device-ai",
  "edge-ai",
  "mobile-ai",
  "vulkan",
  "vulkan-compute",
  "gpu-acceleration",
  "real-time-factor",
  "low-latency",
  "arm64",
  "android",
  "snapdragon",
  "adreno",
  "exynos",
  "arm-mali",
  "zero-compilation",
  "vad",
  "voice-activity-detection",
  "silero-vad",
  "x-vector",
  "k-means",
  "clustering",
  "srt-export",
  "vtt-export",
  "rttm",
  "microphone-streaming",
  "headless-audio",
  "pulseaudio",
  "offline-speech",
  "privacy-first",
  "termux-aichain",
  "termux-tts",
  "termux-llamacpp",
  "termux-diffusion",
  "ameva-runtime",
  "ggml",
  "quantization",
  "bionic-libc",
  "autonomous-agents",
  "voice-assistant"
]
authors = [
  {name = "Eunho Kim (@uno-km)"}
]
dependencies = ["cffi>=1.15.0", "srt>=3.5.0", "ameva-device-sdk @ https://github.com/uno-km/ameva-device-sdk/releases/download/v0.2.0/ameva_device_sdk-0.2.0-py3-none-any.whl#sha256=81e555feb798a1d84c5e605c831d80a33ecb579d32e14a74ca4674ad9ab03085", "ameva-component-sdk @ https://github.com/uno-km/ameva-component-sdk/releases/download/v0.1.2/ameva_component_sdk-0.1.2-py3-none-any.whl#sha256=6d02eaf3cbd0be9ed02ab24f279eb3736da8c3a1c28762e3411ee428931549c6"]

[project.optional-dependencies]
gpu = ["ameva-runtime>=2.0.0"]
# component = ["ameva-component-sdk>=0.1.0,<2.0"]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
termux-stt = "termux_stt.cli.main:main"
termux-stt-install = "termux_stt.platform.installer:main"

[project.entry-points."ameva.components"]
termux-stt = "termux_stt.adapter:create_adapter"


[project.urls]
Homepage = "https://uno-km.vercel.app/lib/stt/"
Documentation = "https://uno-km.vercel.app/lib/stt/"
Repository = "https://github.com/uno-km/termux-stt"
Issues = "https://github.com/uno-km/termux-stt/issues"

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E722"]

[tool.ruff.lint.isort]
known-first-party = ["termux_stt"]

[tool.setuptools.packages.find]
where = ["."]
include = ["termux_stt*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]



