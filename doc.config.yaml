# docs/doc.config.yaml
name: "Termux-STT"
package_name_pypi: "termux-stt"
package_name_npm: "termux-stt"
version: "v2.1.0"
release_name: "Neural Multi-Speaker Diarization & Concurrent GPU/CPU Pipeline"
license: "Apache-2.0"
platform: "Android ARM64 / Termux Bionic"
github_repo_url: "https://github.com/uno-km/termux-stt"
homepage_url: "https://uno-km.vercel.app/lib/stt/"
doc_url: "https://uno-km.vercel.app/lib/stt/"

tagline_en: "Unified On-Device Speech-to-Text & Neural Multi-Speaker Diarization (PyAnnote 3.0 + CAM++ 192d + TS-VAD Overlap Resolver)"
tagline_ko: "디바이스 리소스를 활용한 통합 온디바이스 음성인식(STT) 및 차세대 신경망 화자 분리(PyAnnote 3.0 + CAM++ 192d + TS-VAD) 프레임워크"

quick_install_cmd: "pip install --upgrade termux-stt && termux-stt install\n# or Node.js:\nnpm install -g termux-stt && termux-stt install"

why_challenge_en: "Transcribing and diarizing multi-speaker conversations on edge devices typically demands heavy PyTorch runtimes (>2GB), external GPU servers, and severe cloud network latency with audio privacy risks."
why_challenge_ko: "모바일 및 엣지 단말기에서 다중 화자 음성 인식 및 화자 분리를 수행하려면 2GB 이상의 무거운 PyTorch 런타임, 클라우드 API 호출 비용, 오디오 개인정보 유출 위험 및 심각한 지연시간이 발생합니다."

description_en: "Integrates Whisper.cpp (Native Vulkan GPU / NEON CPU) and Sherpa-ONNX with PyAnnote 3.0 neural segmentation, 3D-Speaker CAM++ 192-dim embeddings, and TS-VAD overlapped speech resolution with zero cloud egress."
description_ko: "Whisper.cpp(네이티브 Vulkan GPU / NEON CPU) 및 Sherpa-ONNX 듀얼 모던 엔진을 통합하고, PyAnnote 3.0 신경망 세그멘테이션, 3D-Speaker CAM++ 192차원 성문 임베딩, TS-VAD 동시 발화(마이크 물림) 분리기를 결합하여 완전 온디바이스 실시간 다중 화자 음성인식을 구현합니다."

features:
  - title_en: "Asymmetric Vulkan GPU / CPU Hybrid Pipeline"
    title_ko: "비대칭 GPU/CPU 하이브리드 가속 파이프라인"
    desc_en: "Offloads dense audio encoder GEMMs to Vulkan mobile GPUs while retaining single-token sequential autoregressive decoding on host ARM NEON CPU SIMD vector units, achieving up to 21% lower latency."
    desc_ko: "연산 집약적인 오디오 인코더 GEMM은 모바일 Vulkan GPU로 오프로딩하고, 단일 토큰 순차 자기회귀 디코더는 호스트 ARM NEON CPU SIMD에서 실행하여 최대 21%의 지연시간 단축과 발열 차단을 달성합니다."
  - title_en: "Dual Modern STT Engine Architecture"
    title_ko: "듀얼 모던 STT 엔진 아키텍처"
    desc_en: "Seamlessly switches between Whisper.cpp (high accuracy, Vulkan GPU/CPU) and Sherpa-ONNX SenseVoice (ultra-low latency on-device ASR) via a unified create_engine() factory."
    desc_ko: "단일 create_engine() 팩토리 API를 통해 Whisper.cpp(정밀도, Vulkan GPU/CPU 가속)와 Sherpa-ONNX SenseVoice(초저지연 온디바이스 ASR) 모던 엔진을 자유롭게 전환합니다."
  - title_en: "Next-Gen Neural Diarization (PyAnnote 3.0 + CAM++ 192d)"
    title_ko: "차세대 신경망 화자 분리 (PyAnnote 3.0 + CAM++ 192d)"
    desc_en: "Deploys PyAnnote 3.0 neural segmentation ONNX combined with Alibaba 3D-Speaker CAM++ 192-dimensional d-vector embeddings, achieving high speaker clustering accuracy without PyTorch."
    desc_ko: "PyTorch 런타임 없이도 PyAnnote 3.0 ONNX 세그멘테이션과 Alibaba 3D-Speaker CAM++ 192차원 성문 임베딩을 결합하여 고정밀 다중 화자 군집화를 구현합니다."
  - title_en: "TS-VAD Overlapped Speech Resolution"
    title_ko: "TS-VAD 동시 발화(마이크 물림) 분리"
    desc_en: "Resolves cross-talk and sudden interruptions (e.g., overlapping questions) into distinct speaker audio streams using target-speaker acoustic scanning."
    desc_ko: "대화 중 끼어들기나 동시 발화('왜요?' 등 마이크 물림 현상) 구간을 타깃 화자 음향 스캐닝을 통해 개별 화자 스트림으로 정확히 분리합니다."
  - title_en: "Zero Cloud Egress Audio Privacy"
    title_ko: "완전 온디바이스 로컬 보안"
    desc_en: "Audio capture, acoustic feature extraction, neural diarization, and text transcription execute strictly on local mobile hardware without network egress."
    desc_ko: "음성 수집, 음향 특징 추출, 신경망 화자 분리, 텍스트 전사 및 자막 생성이 외부 네트워크 전송 없이 단말기 로컬 하드웨어에서만 독립 구동됩니다."
  - title_en: "Subprocess Crash Isolation"
    title_ko: "서브프로세스 장애 격리 보호"
    desc_en: "Isolates native C++ binaries within dedicated process pools, ensuring C++ segfaults never compromise the host Python or Node.js runtime."
    desc_ko: "C++ 네이티브 엔진을 전용 서브프로세스 풀로 완벽 격리하여 C++ 세그멘테이션 폴트가 발생해도 호스트 런타임의 안전성을 신뢰성 높게 보장합니다."
  - title_en: "Modular & Interactive Model Provisioning"
    title_ko: "모듈식 및 대화형 모델 프로비저닝"
    desc_en: "Keeps standard installation lightweight while offering on-demand neural diarization installation (--engine diarization / --all) with interactive TTY [y/N] prompts."
    desc_ko: "기본 설치는 가볍게 유지하며, 화자 분리가 필요할 때만 선별 설치(--engine diarization / --all)하거나 CLI 대화형 [y/N] 프롬프트로 자동 안내합니다."

